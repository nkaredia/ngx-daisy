<section class="menu-example-shell">
  <div class="menu-example-brand">
    <span aria-hidden="true">N</span>
    <div><strong>Northstar</strong><small>Product workspace</small></div>
  </div>
  <ul
    dsyMenu
    class="menu-example-navigation"
    [size]="props().size ?? 'md'"
    [orientation]="props().orientation ?? 'vertical'"
    [paged]="props().paged ?? false"
  >
    <li dsyMenuTitle>Workspace</li>
    <li>
      <a
        dsyMenuItem
        href="#menu-example-overview"
        [disabled]="item().disabled ?? false"
        [active]="item().active ?? false"
        [focused]="item().focused ?? false"
        ><svg lucideHouse size="1em" aria-hidden="true"></svg>Overview
        <span class="menu-example-count">4</span></a
      >
    </li>
    <li>
      <details dsyMenuSubmenu [(opened)]="submenuOpened">
        <summary><svg lucideFolder size="1em" aria-hidden="true"></svg>Projects</summary>
        <ul>
          <li><a dsyMenuItem href="/buttons">Mobile refresh</a></li>
          <li><a dsyMenuItem href="/cards">Design system</a></li>
        </ul>
      </details>
    </li>
    <li>
      <button
        dsyMenuDropdownToggle
        aria-controls="menu-example-resources"
        type="button"
        [opened]="dropdownOpened()"
        (click)="dropdownOpened.update(toggle)"
      >
        <svg lucideUsers size="1em" aria-hidden="true"></svg>Team resources
      </button>
      <ul dsyMenuDropdown id="menu-example-resources" [opened]="dropdownOpened()">
        <li><a dsyMenuItem href="/tabs">Planning board</a></li>
        <li><a dsyMenuItem href="/drawers">Shared files</a></li>
      </ul>
    </li>
  </ul>
  <article class="menu-example-overview" id="menu-example-overview">
    <span>This week</span>
    <strong>4 milestones are on track</strong>
    <p>Use the menu to move between your workspace and nested project destinations.</p>
    <div
      role="progressbar"
      aria-label="Project completion"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="72"
    >
      <span style="width: 72%"></span>
    </div>
  </article>
</section>
