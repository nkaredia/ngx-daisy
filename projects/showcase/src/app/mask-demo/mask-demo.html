<section class="action-demo catalog-demo">
  <h2>Masks</h2>
  <p>Shape clipping for images and decorative content. Keep meaningful image alternatives.</p>
  @for (preview of playground.previews; track preview) {
    <demo-playground [component]="preview" />
  }

  <section class="demo-card">
    <h3>Shapes</h3>
    <div class="catalog-mask-grid">
      <figure>
        <img
          dsyMask
          shape="squircle"
          src="/display/mountain.svg"
          alt="Alpine landscape with squircle crop"
          class="w-24 h-24 object-cover"
        />
        <figcaption>squircle</figcaption>
      </figure>
      <figure>
        <img
          dsyMask
          shape="heart"
          src="/display/mountain.svg"
          alt="Alpine landscape with heart crop"
          class="w-24 h-24 object-cover"
        />
        <figcaption>heart</figcaption>
      </figure>
      <figure>
        <img
          dsyMask
          shape="hexagon"
          src="/display/mountain.svg"
          alt="Alpine landscape with hexagon crop"
          class="w-24 h-24 object-cover"
        />

      </figure>
      <figure>
        <img
          dsyMask
          shape="hexagon-2"

          class="w-24 h-24 object-cover"
        />
        <figcaption>hexagon-2</figcaption>
      </figure>
      <figure>
        <img

      <figure>

  </section>
  <section class="demo-card">
    <h3>Half masks</h3>
    <div class="demo-row">
      <img
        dsyMask
        shape="circle"
        half="first"
        src="/display/coast.svg"
        alt="Coastal landscape, first half"
        class="w-24 h-24 object-cover"
      /><img
        dsyMask
        shape="circle"
        half="second"
        src="/display/coast.svg"
        alt="Coastal landscape, second half"
        class="w-24 h-24 object-cover"
      />
    </div>
  </section>
</section>
