<article class="icon-example-destination">
  <div class="icon-example-glyph">
    <dsy-icon
      [size]="props().size || '1.5rem'"
      [color]="props().color ?? 'primary'"
      [aria-label]="props().label"
      ><svg lucideHouse aria-hidden="true"></svg
    ></dsy-icon>
  </div>
  <div>
    <p>Workspace</p>
    <h3>Dashboard</h3>
    <span>Overview, activity, and quick actions</span>
  </div>
  <span class="icon-example-shortcut" aria-label="Keyboard shortcut G then D">G · D</span>
</article>
