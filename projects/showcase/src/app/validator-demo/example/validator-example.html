<section class="validator-example-card" aria-labelledby="validator-example-title">
  <span class="validator-example-kicker">Account recovery</span>
  <h3 id="validator-example-title">Where should we send the link?</h3>
  <p>Use the email address associated with your workspace.</p>
  <label>
    <span>Email address</span>
    <input
      #control
      dsyInput
      dsyValidator
      type="email"
      required
      autocomplete="email"
      placeholder="name@example.com"
      [color]="secondary().color"
      [size]="secondary().size"
      [variant]="secondary().variant ?? 'bordered'"
      [value]="value()"
      (input)="value.set(control.value)"
    />
  </label>
  <div class="validator-example-status" [class.validator-example-valid]="control.validity.valid">
    <span aria-hidden="true">{{ control.validity.valid ? '✓' : 'i' }}</span>
    <span>{{ control.validity.valid ? 'Email looks good' : 'Enter a valid email address' }}</span>
  </div>
</section>
