<div class="showcase-shell" [attr.data-theme]="theme()">
  <dsy-drawer-container class="showcase-drawer-container">
    <dsy-drawer-content>
      <a
        class="showcase-skip-link"
        [routerLink]="[]"
        fragment="showcase-content"
        queryParamsHandling="preserve"
        >Skip to examples</a
      >
      @if (!desktop()) {
        <header class="showcase-mobile-titlebar">
          <button
            dsyButton
            variant="ghost"
            shape="square"
            type="button"
            aria-label="Open component navigation"
            aria-controls="showcase-navigation"
            [attr.aria-expanded]="navigationOpened()"
            (click)="navigationDrawer.toggle()"
          >
            <dsy-icon size="1.25rem"><svg lucideMenu aria-hidden="true"></svg></dsy-icon>
          </button>
          <a class="showcase-brand" routerLink="/buttons"
            ><span class="showcase-brand-name">ngx-daisy</span
            ><span class="showcase-version">v{{ version }}</span></a
          >
        </header>
      }
      <main
        #showcaseContent
        id="showcase-content"
        class="showcase-content"
        tabindex="-1"
        aria-label="Component examples"
      >
        <router-outlet />
      </main>
    </dsy-drawer-content>
    <dsy-drawer
      #navigationDrawer
      id="showcase-navigation"
      width="18rem"
      [mode]="desktop() ? 'side' : 'over'"
      [(opened)]="navigationOpened"
      aria-label="Component navigation"
    >
      <div class="showcase-sidebar">
        <div class="showcase-navigation-header">
          @if (desktop()) {
            <a class="showcase-brand" routerLink="/buttons"
              ><span class="showcase-brand-name">ngx-daisy</span
              ><span class="showcase-version">v{{ version }}</span></a
            >
          } @else {
            <span class="showcase-navigation-title">Components</span>
            <button
              dsyButton
              variant="ghost"
              shape="square"
              size="sm"
              type="button"
              aria-label="Close component navigation"
              (click)="navigationDrawer.close()"
            >
              <dsy-icon size="1rem"><svg lucideX aria-hidden="true"></svg></dsy-icon>
            </button>
          }
        </div>
        <nav class="showcase-navigation" aria-label="Components">
          @for (group of groups; track group.id) {
            <section
              class="showcase-navigation-group"
              [attr.aria-labelledby]="'category-' + group.id"
            >
              <h2 [id]="'category-' + group.id">
                <dsy-icon size="1em"
                  ><svg [lucideIcon]="group.icon" aria-hidden="true"></svg></dsy-icon
                ><span>{{ group.label }}</span>
              </h2>
              <ul>
                @for (page of group.pages; track page.path) {
                  <li>
                    <a
                      [routerLink]="'/' + page.path"
                      routerLinkActive="showcase-navigation-active"
                      ariaCurrentWhenActive="page"
                      >{{ page.label }}</a
                    >
                  </li>
                }
              </ul>
            </section>
          }
        </nav>
        <footer class="showcase-sidebar-footer">
          <button
            dsyButton
            variant="ghost"
            type="button"
            class="showcase-theme-button"
            aria-label="Switch theme"
            [attr.aria-pressed]="theme() === 'dark'"
            (click)="toggleTheme()"
          >
            <svg
              class="showcase-theme-icon"
              [lucideIcon]="theme() === 'dark' ? themeIcons.moon : themeIcons.sun"
              aria-hidden="true"
            ></svg>
            <span class="showcase-theme-copy"
              >Switch theme
              <small aria-hidden="true"
                >{{ theme() === 'dark' ? 'Dark' : 'Light' }} mode</small
              ></span
            >
            <span
              class="showcase-theme-toggle"
              aria-hidden="true"
              [attr.data-enabled]="theme() === 'dark'"
              ><span></span
            ></span>
          </button>
        </footer>
      </div>
    </dsy-drawer>
  </dsy-drawer-container>
</div>
