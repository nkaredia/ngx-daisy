<demo-documentation-page
  [sections]="documentationSections"
  navigationLabel="Keyboard Shortcuts documentation sections"
>
  <div id="kbd-overview" class="component-documentation-demo">
    <section class="action-demo display-demo">
      <h2>Keyboard Shortcuts</h2>
      <p>Native keyboard markup for shortcuts and key combinations.</p>
      <h3 id="kbd-examples" class="component-documentation-examples-heading">
        Playground and UI examples
      </h3>
      @for (preview of playground.previews; track preview) {
        <demo-playground [component]="preview" />
      }

      <section class="demo-card">
        <h3>Search</h3>
        <p>
          Press <kbd dsyKbd>⌘</kbd
          ><svg lucidePlus size="1em" class="inline-block" aria-hidden="true"></svg
          ><kbd dsyKbd>K</kbd> to open search.
        </p>
      </section>
      <section class="demo-card">
        <h3>Sizes</h3>
        <div class="demo-row">
          <kbd dsyKbd size="xs">XS</kbd><kbd dsyKbd size="sm">SM</kbd><kbd dsyKbd size="md">MD</kbd
          ><kbd dsyKbd size="lg">LG</kbd><kbd dsyKbd size="xl">XL</kbd>
        </div>
      </section>
    </section>
  </div>
  <demo-component-documentation [content]="documentation" [playground]="playground" />
</demo-documentation-page>
