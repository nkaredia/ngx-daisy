<div class="kbd-example-search">
  <span aria-hidden="true"
    ><svg lucideSearch size="1em" class="inline-block" aria-hidden="true"></svg
  ></span>
  <div>
    <strong>Search workspace</strong>
    <p>Pages, people, and recent files</p>
  </div>
  <span class="kbd-example-shortcut">
    <kbd dsyKbd [size]="props().size ?? 'md'">Ctrl</kbd>
    <span aria-hidden="true"
      ><svg lucidePlus size="1em" class="inline-block" aria-hidden="true"></svg
    ></span>
    <kbd dsyKbd [size]="props().size ?? 'md'">K</kbd>
  </span>
</div>
