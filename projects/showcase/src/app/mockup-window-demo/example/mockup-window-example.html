<dsy-mockup-window class="border border-base-300 bg-base-200">
  <div class="mockup-window-example-content bg-base-100">
    <aside aria-hidden="true">
      <strong>Settings</strong><span>General</span><span>Members</span><span>Billing</span
      ><span>Integrations</span>
    </aside>
    <section>
      <header>
        <div>
          <p>Workspace settings</p>
          <h3>General</h3>
        </div>
        <span>Saved</span>
      </header>
      <div class="mockup-window-example-profile">
        <span aria-hidden="true">ND</span>
        <div><strong>ngx-daisy team</strong><small>12 members</small></div>
        <button dsyButton type="button" size="sm" variant="outline">Change logo</button>
      </div>
      <label>Workspace name <input dsyInput type="text" value="Design system" /></label>
      <label
        >Workspace URL <input dsyInput type="url" value="https://studio.example/design"
      /></label>
      <footer>
        <button dsyButton type="button" variant="ghost">Cancel</button
        ><button dsyButton type="button" color="primary">Save changes</button>
      </footer>
    </section>
  </div>
</dsy-mockup-window>
