<section class="inline-preview-shell" [attr.aria-labelledby]="headingId">
  <h3 [id]="headingId">{{ title() }}</h3>
  @if (description()) {
    <p class="inline-preview-description">{{ description() }}</p>
  }
  <demo-inline-preview [component]="component()" />
  @if (sourceFiles().length) {
    <demo-example-code [files]="sourceFiles()" [showToggle]="false" [expanded]="true" />
  }
</section>
