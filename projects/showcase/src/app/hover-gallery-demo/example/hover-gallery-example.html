<figure class="hover-gallery-example-frame">
  <dsy-hover-gallery
    [images]="images"
    [controls]="props().controls ?? false"
    [activeIndex]="props().activeIndex ?? 0"
    [label]="props().label ?? 'Image gallery'"
  />
  <figcaption>
    <div><span>Travel journal</span><strong>Three landscapes, one quiet weekend</strong></div>
    <p>Move across the photograph or use the arrow keys to explore.</p>
  </figcaption>
</figure>
