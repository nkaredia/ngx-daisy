<article class="countdown-example-launch">
  <div>
    <p class="countdown-example-eyebrow">Next release window</p>
    <h3>Launch checklist closes soon</h3>
    <p>Complete the remaining approvals before the release is locked.</p>
  </div>
  <div class="countdown-example-value">
    <div class="text-5xl tabular-nums">
      <dsy-countdown [value]="props().value ?? 0" [digits]="props().digits ?? 1" />
    </div>
    <span>minutes</span>
  </div>
</article>
