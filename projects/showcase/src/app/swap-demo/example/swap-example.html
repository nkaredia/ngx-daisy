<article class="swap-example-setting">
  <div class="swap-example-icon" aria-hidden="true">
    <svg lucideSparkles size="1em" class="inline-block" aria-hidden="true"></svg>
  </div>
  <div class="swap-example-copy">
    <h3>Weekly highlights</h3>
    <p>Receive one concise summary every Friday.</p>
  </div>
  <dsy-swap
    [checked]="checked()"
    (checkedChange)="checked.set($event)"
    [indeterminate]="indeterminate()"
    (indeterminateChange)="indeterminate.set($event)"
    [disabled]="props().disabled ?? false"
    [animation]="props().animation ?? 'none'"
    [aria-label]="props().label ?? 'Receive weekly highlights'"
    [color]="props().color"
    [size]="props().size"
    [variant]="props().variant ?? 'plain'"
    [buttonClass]="props().buttonClass ?? ''"
  >
    <span dsySwapOff aria-hidden="true"
      ><svg lucideCircle size="1em" class="inline-block" aria-hidden="true"></svg></span
    ><span dsySwapOn aria-hidden="true"
      ><svg lucideCheck size="1em" class="inline-block" aria-hidden="true"></svg></span
    ><span dsySwapIndeterminate aria-hidden="true"
      ><svg lucideMinus size="1em" class="inline-block" aria-hidden="true"></svg
    ></span>
  </dsy-swap>
</article>
<p class="swap-example-status" role="status">
  Weekly highlights {{ checked() ? 'enabled' : 'disabled' }}
</p>
