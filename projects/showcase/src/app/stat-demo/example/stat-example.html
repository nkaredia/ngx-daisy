<dsy-stats
  class="stat-example-overview shadow max-w-full"
  [orientation]="props().orientation ?? 'horizontal'"
  ><dsy-stat
    ><div dsyStatTitle>Total visits</div>
    <div dsyStatValue class="text-primary">31.2K</div>
    <div dsyStatDesc>12% more this month</div></dsy-stat
  ><dsy-stat
    ><div dsyStatTitle>Downloads</div>
    <div dsyStatValue>4,820</div>
    <div dsyStatDesc>Across all components</div></dsy-stat
  ><dsy-stat
    ><div dsyStatTitle>Conversion</div>
    <div dsyStatValue>7.8%</div>
    <div dsyStatDesc>0.9 points above target</div></dsy-stat
  ></dsy-stats
>
