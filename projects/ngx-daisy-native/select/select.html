<Button
  #trigger
  dsyButton
  [text]="selectedLabel() + '  ▾'"
  variant="outline"
  dsyLayout="block"
  [dsyColor]="color()"
  [size]="size()"
  [disabled]="isDisabled()"
  [accessibilityLabel]="accessibleLabel() + ', ' + selectedLabel()"
  [accessibilityHint]="accessibleDescription()"
  class="dsy-native-select-trigger"
  [class]="triggerClass()"
  (pressed)="open()"
></Button>
