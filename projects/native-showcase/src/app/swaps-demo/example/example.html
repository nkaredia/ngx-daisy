<Label text="Workspace notifications" class="text-[20px] font-bold mb-3"></Label
><Label text="Keep important updates within reach." textWrap="true" class="mb-4 opacity-70"></Label
><Button
  dsySwap
  [checked]="value('checked', false)"
  [indeterminate]="value('indeterminate', false)"
  [disabled]="value('disabled', false)"
  [label]="value('label', 'Notifications')"
  [onText]="value('onText', 'Notifications on')"
  [offText]="value('offText', 'Notifications off')"
  [indeterminateText]="value('indeterminateText', 'Mixed')"
  [dsyColor]="value('color', undefined)"
  [size]="value('size', 'md')"
></Button>
