<Label text="Stay in the loop" class="text-[20px] font-bold mb-3"></Label
><Label text="Receive important workspace updates." textWrap="true" class="mb-3 opacity-70"></Label
><Switch
  dsyToggle
  [checked]="value('checked', true)"
  [disabled]="value('disabled', false)"
  [readonly]="value('readonly', false)"
  [hidden]="value('hidden', false)"
  [label]="value('label', 'Workspace updates')"
  [description]="value('description', '')"
  [dsyColor]="value('color', 'primary')"
></Switch>
