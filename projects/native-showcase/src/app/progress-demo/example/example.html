<Label text="Uploading project files" class="text-[20px] font-bold mb-3"></Label
><GridLayout
  dsyProgress
  [value]="value('value', 35)"
  [max]="value('max', 100)"
  [label]="value('label', 'Project upload')"
  [dsyColor]="value('color', 'primary')"
  [indicatorClass]="value('indicatorClass', '')"
/><Label
  text="You can keep working while the upload completes."
  class="opacity-70 mt-4"
  textWrap="true"
></Label>
