<Label text="Summer collection" class="text-[20px] font-bold mb-3"></Label
><StackLayout
  dsyDropdown
  [opened]="value('opened', false)"
  [disabled]="value('disabled', false)"
  [label]="value('label', 'Actions')"
  [panelClass]="value('panelClass', '')"
  [maxHeight]="value('maxHeight', 360)"
  ><Button dsyButton dsyDropdownTrigger text="Workspace actions" dsyColor="primary"></Button
  ><ng-template dsyDropdownContent
    ><Button
      dsyButton
      dsyDropdownItem
      text="Invite teammate"
      variant="ghost"
      (pressed)="notice.set('Invitation ready')"
    ></Button
    ><Button
      dsyButton
      dsyDropdownItem
      text="Copy project link"
      variant="ghost"
      (pressed)="notice.set('Link ready to share')"
    ></Button></ng-template></StackLayout
><Label [text]="notice()" textWrap="true" class="mt-3"></Label>
