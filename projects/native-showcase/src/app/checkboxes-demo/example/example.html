<Label text="Delivery preferences" class="text-[20px] font-bold mb-3"></Label
><Button
  dsyCheckbox
  [checked]="value('checked', false)"
  [indeterminate]="value('indeterminate', false)"
  [disabled]="value('disabled', false)"
  [readonly]="value('readonly', false)"
  [hidden]="value('hidden', false)"
  [invalid]="value('invalid', false)"
  [touched]="value('touched', false)"
  [label]="value('label', 'Send tracking updates')"
  [description]="value('description', 'Get a notification when your order ships.')"
  [dsyColor]="value('color', 'primary')"
  [size]="value('size', 'md')"
></Button>
